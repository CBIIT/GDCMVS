name: Deploy GDC_MVS
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod
      branch:
        description: "Git branch to deploy (for dev/qa only)"
        required: false
        default: "github-actions"
        type: string
  workflow_call:
    inputs:
      tier:
        description: "Tier to deploy to"
        required: true
        type: string
      branch:
        description: "Git branch to deploy (for dev/qa only)"
        required: false
        type: string

env:
  APP: GDC-MVS
  TZ: America/New_York
  AWS_REGION: us-east-1
  TASK_DEFINITION_TEMPLATE_PATH: aws
  DOCKER_BUILDKIT: 1

permissions:
  id-token: write
  contents: read

jobs:
  Deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier  }}
    
    steps:
      - name: Determine checkout branch
        id: checkout-branch
        run: |
          TIER="${{ inputs.tier  }}"
          if [ "$TIER" == "dev" ] || [ "$TIER" == "qa" ]; then
            BRANCH="${{ inputs.branch || 'github-actions' }}"
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.checkout-branch.outputs.branch }}

      # SSH Deployment for dev/qa tiers
      - name: Deploy to server via SSH (dev/qa)
        if: (inputs.tier ) == 'dev' || (inputs.tier ) == 'qa'
        env:
          REMOTE_HOST: ${{ (inputs.tier ) == 'dev' && secrets.DEV_SERVER_HOST || secrets.QA_SERVER_HOST }}
          REMOTE_USER: ${{ (inputs.tier ) == 'dev' && secrets.DEV_SERVER_USER || secrets.QA_SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ (inputs.tier ) == 'dev' && secrets.DEV_SSH_KEY || secrets.QA_SSH_KEY }}
        run: |
          set -x
          
          # Validate required environment variables
          if [ -z "$REMOTE_HOST" ]; then
            echo "❌ Error: REMOTE_HOST is not set. Please configure DEV_SERVER_HOST or QA_SERVER_HOST secret."
            exit 1
          fi
          if [ -z "$REMOTE_USER" ]; then
            echo "❌ Error: REMOTE_USER is not set. Please configure DEV_SERVER_USER or QA_SERVER_USER secret."
            exit 1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ Error: SSH_PRIVATE_KEY is not set. Please configure DEV_SSH_KEY or QA_SSH_KEY secret."
            exit 1
          fi
          
          echo "✅ Environment variables validated"
          echo "Remote host: $REMOTE_HOST"
          echo "Remote user: $REMOTE_USER"
          
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $REMOTE_HOST >> ~/.ssh/known_hosts || true
          
          # Prepare deployment package
          # Use --warning=no-file-changed to ignore "file changed as we read it" warnings
          tar -czf GDCMVS.tgz --warning=no-file-changed --exclude='.git' --exclude='node_modules' --exclude='client/dist' --exclude='.DS_Store' . || {
            # If tar fails, check if it's just the warning
            if [ -f GDCMVS.tgz ]; then
              echo "⚠️  Tar completed with warnings, but archive was created"
            else
              echo "❌ Error: Failed to create archive"
              exit 1
            fi
          }
          
          # Create temporary directory on remote server
          ssh -i ~/.ssh/deploy_key $REMOTE_USER@$REMOTE_HOST \
            'if [ ! -d jenkins-build/GDCMVS ]; then mkdir -p jenkins-build/GDCMVS; fi' || exit $?
          
          # Copy compressed file to remote server
          scp -i ~/.ssh/deploy_key -q GDCMVS.tgz $REMOTE_USER@$REMOTE_HOST:jenkins-build/ || exit $?
          
          # Extract on remote server
          ssh -i ~/.ssh/deploy_key $REMOTE_USER@$REMOTE_HOST \
            'tar -xvzf jenkins-build/GDCMVS.tgz -C jenkins-build/GDCMVS/' || exit $?
          
          # Stop services
          ssh -i ~/.ssh/deploy_key $REMOTE_USER@$REMOTE_HOST \
            '/usr/bin/sudo /usr/sbin/service nodejs stop' || exit $?
          ssh -i ~/.ssh/deploy_key $REMOTE_USER@$REMOTE_HOST \
            '/usr/bin/sudo /usr/sbin/service elasticsearch stop' || exit $?
          
          # Start Elasticsearch
          ssh -i ~/.ssh/deploy_key $REMOTE_USER@$REMOTE_HOST \
            '/usr/bin/sudo /usr/sbin/service elasticsearch start && sleep 10' || exit $?
          
          # Remove old code and install new
          ssh -i ~/.ssh/deploy_key $REMOTE_USER@$REMOTE_HOST \
            'if [ -d /local/content/mvs/GDCMVS ]; then rm -rf /local/content/mvs/GDCMVS; fi' || exit $?
          
          ssh -i ~/.ssh/deploy_key $REMOTE_USER@$REMOTE_HOST \
            'mv -v jenkins-build/GDCMVS /local/content/mvs/ &&
             cd /local/content/mvs/GDCMVS &&
             npm install &&
             npm run build &&
             sleep 5;' || exit $?
          
          # Start nodejs
          ssh -i ~/.ssh/deploy_key $REMOTE_USER@$REMOTE_HOST \
            '/usr/bin/sudo /usr/sbin/service nodejs start; sleep 10' || exit $?
          
          # Remove old Elasticsearch index
          ssh -i ~/.ssh/deploy_key $REMOTE_USER@$REMOTE_HOST \
            'curl -X DELETE http://localhost:9200/_all && sleep 5' || exit $?
          
          # Rebuild indexes
          ssh -i ~/.ssh/deploy_key $REMOTE_USER@$REMOTE_HOST \
            'curl http://localhost:3000/search/buildIndex && sleep 25' || exit $?
          
          # Clean up temporary workspace
          ssh -i ~/.ssh/deploy_key $REMOTE_USER@$REMOTE_HOST \
            'if [ -d jenkins-build ]; then rm -rf jenkins-build; fi' || exit $?
          
          echo "✅ Deployment to ${{ inputs.tier  }} completed successfully"

      # AWS ECS Deployment for stage/prod tiers
      - name: Set up Node.js (AWS deployment)
        if: (inputs.tier ) == 'stage' || (inputs.tier ) == 'prod'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (AWS deployment)
        if: (inputs.tier ) == 'stage' || (inputs.tier ) == 'prod'
        run: npm ci

      - name: Build client application (AWS deployment)
        if: (inputs.tier ) == 'stage' || (inputs.tier ) == 'prod'
        run: npm run build

      - name: Check AWS configuration
        if: (inputs.tier ) == 'stage' || (inputs.tier ) == 'prod'
        id: check-aws
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "aws_configured=false" >> $GITHUB_OUTPUT
            echo "AWS credentials not configured, deployment will skip Docker/ECS steps"
          else
            echo "aws_configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.check-aws.outputs.aws_configured == 'true' && ((inputs.tier ) == 'stage' || (inputs.tier ) == 'prod')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::688132009233:role/github_evstools_dev
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        if: steps.check-aws.outputs.aws_configured == 'true' && ((inputs.tier ) == 'stage' || (inputs.tier ) == 'prod')
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        if: steps.check-aws.outputs.aws_configured == 'true' && ((inputs.tier ) == 'stage' || (inputs.tier ) == 'prod')
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.APP }}-${{ inputs.tier  }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Check if Dockerfile exists
          if [ -f Dockerfile ]; then
            docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          else
            echo "No Dockerfile found, skipping Docker build"
            echo "image=skip" >> $GITHUB_OUTPUT
          fi

      - name: Download task definition
        id: task-def
        if: steps.check-aws.outputs.aws_configured == 'true' && steps.build-image.outputs.image != 'skip' && (inputs.tier == 'stage' ||inputs.tier == 'prod')
        env:
          ECR_REPOSITORY: ${{ env.APP }}-${{ inputs.tier  }}
        run: |
          # Try to download task definition from S3 or use local template
          if [ -f "${{ env.TASK_DEFINITION_TEMPLATE_PATH }}/task-definition.json" ]; then
            cp "${{ env.TASK_DEFINITION_TEMPLATE_PATH }}/task-definition.json" task-definition.json
          else
            echo "Creating task definition from template..."
            # Create a basic task definition if none exists
            cat > task-definition.json <<EOF
          {
            "family": "${{ env.APP }}-${{ inputs.tier  }}",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": "${{ secrets.AWS_TASK_EXECUTION_ROLE_ARN }}",
            "taskRoleArn": "${{ secrets.AWS_TASK_ROLE_ARN }}",
            "containerDefinitions": [
              {
                "name": "${{ env.APP }}-${{ inputs.tier  }}",
                "image": "${{ steps.build-image.outputs.image }}",
                "essential": true,
                "portMappings": [
                  {
                    "containerPort": 3000,
                    "protocol": "tcp"
                  }
                ],
                "environment": [
                  {
                    "name": "NODE_ENV",
                    "value": "${{ (inputs.tier ) == 'prod' && 'prod' || (inputs.tier ) }}"
                  },
                  {
                    "name": "PORT",
                    "value": "3000"
                  }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/${{ env.APP }}-${{ inputs.tier  }}",
                    "awslogs-region": "${{ env.AWS_REGION }}",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ]
          }
          EOF
          fi

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def-update
        if: steps.build-image.outputs.image != 'skip' && ((inputs.tier ) == 'stage' || (inputs.tier ) == 'prod')
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.APP }}-${{ inputs.tier  }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        if: steps.build-image.outputs.image != 'skip' && ((inputs.tier ) == 'stage' || (inputs.tier ) == 'prod')
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-update.outputs.task-definition }}
          service: ${{ env.APP }}-${{ inputs.tier  }}
          cluster: ${{ env.APP }}-${{ inputs.tier  }}
          wait-for-service-stability: true

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          TIER="${{ inputs.tier  }}"
          echo "- **Tier**: $TIER" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ steps.checkout-branch.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          if [ "$TIER" == "dev" ] || [ "$TIER" == "qa" ]; then
            echo "- **Deployment Method**: SSH to server" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ✅ Deployed successfully" >> $GITHUB_STEP_SUMMARY
          else
            if [ "${{ steps.build-image.outputs.image }}" != "skip" ]; then
              echo "- **Image**: ${{ steps.build-image.outputs.image }}" >> $GITHUB_STEP_SUMMARY
              echo "- **Status**: ✅ Deployed to ECS" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **Status**: ⚠️ Build completed (no Docker deployment)" >> $GITHUB_STEP_SUMMARY
            fi
          fi
