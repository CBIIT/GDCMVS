name: Restart Node.js Service

on:
  workflow_dispatch:  # You can trigger manually, or replace with push/schedule/etc.

permissions:
  id-token: write     # Required for GitHub OIDC to assume the AWS role
  contents: read

jobs:
  restart-node-service:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::688132009233:role/github_evstools_dev
          aws-region: us-east-1

      - name: Restart Node.js service on EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids "i-08eb1556c6cd5e596" \
            --document-name "AWS-RunShellScript" \
            --comment "Restarting Node.js service" \
            --parameters 'commands=["sudo systemctl restart nodejs"]'

      # Optional: Verify service status (if you want confirmation)
      - name: Check Node.js service status
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-08eb1556c6cd5e596" \
            --document-name "AWS-RunShellScript" \
            --comment "Check Node.js service status" \
            --parameters 'commands=["sudo systemctl status nodejs -l"]' \
            --query "Command.CommandId" \
            --output text)
          
          echo "Command ID: $COMMAND_ID"
          echo "Waiting for command to complete..."
          sleep 5
          
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-08eb1556c6cd5e596" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' \
            --output table

